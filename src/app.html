<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#4f46e5" />
		<meta name="description" content="Aplikasi manajemen keuangan pribadi: catat arus kas, pantau anggaran, dan scan struk belanja otomatis." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="FinanceApp" />
		%sveltekit.head%
		<script>
		try {
			var t = localStorage.getItem('fa-theme');
			var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (dark) document.documentElement.classList.add('dark');
		} catch (e) {}
	</script>
</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
