services:
  db:
    image: postgres:16-alpine
    container_name: financeapp-db
    environment:
      POSTGRES_USER: financeapp
      POSTGRES_PASSWORD: financeapp
      POSTGRES_DB: finance_app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financeapp -d finance_app']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
